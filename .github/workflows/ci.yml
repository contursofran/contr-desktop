name: CI
on:
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release notes script (release.yml): its test, and a dry run that prints the notes and release.json for this commit.
      - run: node --test scripts/release-notes.test.mjs
      - run: node scripts/release-notes.mjs --dry-run --json "$RUNNER_TEMP/release.json" && cat "$RUNNER_TEMP/release.json"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # scripts/fetch-helper with a fake gh: the repository, the prerelease skip and the zip layout.
      - run: node --test scripts/fetch-helper.test.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter desktop exec playwright install chromium --only-shell
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-browser
          path: tmp/shots/

  electron:
    name: Electron ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-electron-${{ matrix.shard }}
          path: tmp/shots/

  CI:
    needs: [checks, electron]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks and both Electron shards
        run: test "${{ needs.checks.result }}" = success && test "${{ needs.electron.result }}" = success
